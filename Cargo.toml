[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace]
members = [
    "crates/pixie-kernel",
    "crates/pixie-syntax",
    "crates/pixie-hir",
    "crates/pixie-types",
    "crates/pixie-binding",
    "crates/pixie-driver",
    "crates/pixie-interp",
    "crates/pixie-rpi-gen",
    "crates/pixie-codegen",
    "crates/pixie-cli",
    "crates/pixie-lsp",
    "crates/pixie-engine-gpui",
    "crates/yokan",
    "crates/yokan-stdlib",
]
resolver = "2"

[workspace.dependencies]
pixie-syntax = { path = "crates/pixie-syntax" }
pixie-hir = { path = "crates/pixie-hir" }
pixie-types = { path = "crates/pixie-types" }
pixie-binding = { path = "crates/pixie-binding" }
pixie-kernel = { path = "crates/pixie-kernel" }
pixie-driver = { path = "crates/pixie-driver" }
pixie-interp = { path = "crates/pixie-interp" }
pixie-codegen = { path = "crates/pixie-codegen" }
pixie-rpi-gen = { path = "crates/pixie-rpi-gen" }

codespan-reporting = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
insta = { version = "1.41", features = ["yaml"] }

# The vendored lower half (DESIGN section 5): gpui_macos carried as a
# patched copy so lower-half fixes (P1: panic containment in the mac
# input callbacks) ride our tree. Upgrade = re-vendor + re-apply.
[patch."https://github.com/zed-industries/zed"]
gpui_macos = { path = "vendor/gpui_macos" }
