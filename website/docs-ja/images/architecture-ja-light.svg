<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Hiragino Sans','Noto Sans JP',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f88a8"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2866ad"/>
    </marker>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#e9ecf4"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="796" rx="20" fill="#fbfcfe" stroke="#dcdfe9" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="796" rx="20" fill="url(#dots)"/>

  <!-- ============ the one source file ============ -->
  <rect x="430" y="30" width="340" height="136" rx="14" fill="#edeff6" stroke="#b4bcd2" stroke-width="1.6"/>
  <text x="600" y="60" text-anchor="middle" font-size="21" font-weight="700" fill="#1c2030" font-family="ui-monospace,'SF Mono',Menlo,monospace">app.py</text>
  <text x="600" y="82" text-anchor="middle" font-size="13" fill="#525970">静的に型付けされた Python のサブセット</text>
  <rect x="470" y="96" width="200" height="7" rx="3.5" fill="#b6bed4"/>
  <rect x="470" y="110" width="248" height="7" rx="3.5" fill="#b6bed4"/>
  <rect x="470" y="124" width="160" height="7" rx="3.5" fill="#b6bed4"/>
  <rect x="470" y="138" width="130" height="7" rx="3.5" fill="#5b97d3"/>
  <rect x="608" y="132" width="38" height="18" rx="5" fill="#e2ecf9" stroke="#78a5d4" stroke-width="1.2"/>
  <text x="627" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#2866ad" font-family="ui-monospace,'SF Mono',Menlo,monospace">@py</text>
  <text x="656" y="145" font-size="11" fill="#656b85">← エスケープ</text>

  <path d="M540 166 C 470 190, 390 196, 335 214" fill="none" stroke="#7f88a8" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M660 166 C 730 190, 810 196, 865 214" fill="none" stroke="#7f88a8" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- lane captions -->
  <rect x="249.4" y="190" width="151.1" height="16" fill="#fbfcfe"/>
  <text x="325" y="202" text-anchor="middle" font-size="13.5" fill="#2866ad" font-weight="700">開発：uv run app.py</text>
  <rect x="760.8" y="190" width="228.4" height="16" fill="#fbfcfe"/>
  <text x="875" y="202" text-anchor="middle" font-size="13.5" fill="#a3650a" font-weight="700">リリース：yokan build --release</text>

  <!-- ============ develop lane: the VM loop ============ -->
  <rect x="85" y="214" width="480" height="286" rx="14" fill="#f0f2f8" stroke="#78a5d4" stroke-width="1.6"/>

  <rect x="205" y="238" width="240" height="58" rx="12" fill="#4a9de9" opacity="0.35" filter="url(#glow)"/>
  <rect x="205" y="238" width="240" height="58" rx="12" fill="#e2ecf9" stroke="#4485c4" stroke-width="1.8"/>
  <circle cx="236" cy="267" r="5" fill="#2866ad"/>
  <circle cx="250" cy="267" r="5" fill="#e3a41c"/>
  <text x="336" y="273" text-anchor="middle" font-size="17.5" font-weight="700" fill="#1b4778" font-family="ui-monospace,'SF Mono',Menlo,monospace">CPython VM</text>

  <path d="M325 296 L325 328" fill="none" stroke="#4485c4" stroke-width="1.8" marker-end="url(#arB)"/>

  <!-- the loop -->
  <path d="M 325 342 A 54 54 0 1 1 278 369" fill="none" stroke="#2866ad" stroke-width="2.4" marker-end="url(#arB)"/>
  <text x="325" y="391" text-anchor="middle" font-size="20" font-weight="800" fill="#1c2030">約 1 ms</text>
  <text x="325" y="411" text-anchor="middle" font-size="11.5" fill="#525970">状態はそのまま</text>
  <text x="338" y="327" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f4f82">保存</text>
  <text x="404" y="420" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f4f82">アプリが丸ごと変わる</text>
  <text x="246" y="420" text-anchor="end" font-size="12.5" font-weight="600" fill="#1f4f82">編集</text>

  <text x="325" y="482" text-anchor="middle" font-size="13" fill="#525970">アプリ全体が VM の上で動く、速い開発ループ</text>

  <!-- ============ release lane: the VM leaves ============ -->
  <rect x="635" y="214" width="480" height="286" rx="14" fill="#f0f2f8" stroke="#b4bcd2" stroke-width="1.6"/>

  <rect x="685" y="232" width="380" height="48" rx="11" fill="#edeff6" stroke="#737db4" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="875" y="256" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3d4886" font-family="ui-monospace,'SF Mono',Menlo,monospace">.pix</text>
  <text x="875" y="272" text-anchor="middle" font-size="11.5" fill="#525970">読める中間ソース</text>

  <path d="M875 280 L875 308" fill="none" stroke="#7f88a8" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="889" y="299" text-anchor="start" font-size="12" fill="#525970" font-family="ui-monospace,'SF Mono',Menlo,monospace">rustc</text>

  <rect x="685" y="308" width="380" height="86" rx="12" fill="#3fc98a" opacity="0.28" filter="url(#glow)"/>
  <rect x="685" y="308" width="380" height="86" rx="12" fill="#e2f4ea" stroke="#3a946a" stroke-width="1.8"/>
  <text x="875" y="342" text-anchor="middle" font-size="17.5" font-weight="700" fill="#17724a">ネイティブバイナリ</text>
  <text x="875" y="366" text-anchor="middle" font-size="11.5" fill="#3f6a55">libpython はリンクしない · 11.3 MB（strip 後） · 起動 4.7 ms</text>

  <path d="M875 394 L875 424" fill="none" stroke="#4485c4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arB)"/>

  <rect x="705" y="424" width="340" height="46" rx="11" fill="#e2ecf9" stroke="#4485c4" stroke-width="1.4" stroke-dasharray="6 4"/>
  <circle cx="730" cy="447" r="4.5" fill="#2866ad"/>
  <circle cx="742" cy="447" r="4.5" fill="#e3a41c"/>
  <text x="758" y="452" text-anchor="start" font-size="12.5" font-weight="600" fill="#285f96">CPython VM（@py を使うときだけ）</text>
  <text x="875" y="488" text-anchor="middle" font-size="11.5" fill="#656b85">--bundle / --onefile でアプリに同梱</text>

  <!-- ============ shared foundation ============ -->
  <path d="M325 500 L325 518" fill="none" stroke="#7f88a8" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M875 500 L875 518" fill="none" stroke="#7f88a8" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="85" y="522" width="1030" height="80" rx="13" fill="#f0f2f8" stroke="#8f98c6" stroke-width="1.8"/>
  <text x="600" y="556" text-anchor="middle" font-size="16.5" font-weight="700" fill="#4a559b">pixie-kernel + gpui（Zed のレンダラ）</text>
  <text x="600" y="581" text-anchor="middle" font-size="12.5" fill="#525970">要素、リアクティブな状態、描画。両方の実行を支える、ひとつの Rust 実装</text>

  <!-- ============ the gate ============ -->
  <path d="M325 602 L325 638" fill="none" stroke="#7f88a8" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M875 602 L875 638" fill="none" stroke="#7f88a8" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="311" y="624" text-anchor="end" font-size="11.5" fill="#5f667f">開発実行のダンプ</text>
  <text x="889" y="624" text-anchor="start" font-size="11.5" fill="#5f667f">リリースビルドのダンプ</text>

  <rect x="85" y="644" width="1030" height="112" rx="13" fill="#fdf2da" stroke="#c48a22" stroke-width="1.8"/>
  <text x="600" y="692" text-anchor="middle" font-size="18" font-weight="800" fill="#9a6207">ゲート</text>
  <text x="600" y="722" text-anchor="middle" font-size="13" fill="#6e5c3c">同じ操作スクリプトを両方で再生し、画面をバイト単位で突き合わせます</text>
</svg>
