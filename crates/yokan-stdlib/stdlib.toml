  { fn = "sampleInt", params = "xs: List<Int>, k: Int", ret = "List<Int>", rust = "random_sample_int", flags = "cpython" },
  { fn = "choiceFloat", params = "xs: List<Float>", ret = "Float", rust = "random_choice_float", flags = "cpython" },
  { fn = "sampleFloat", params = "xs: List<Float>, k: Int", ret = "List<Float>", rust = "random_sample_float", flags = "cpython" },
  { fn = "choiceBool", params = "xs: List<Bool>", ret = "Bool", rust = "random_choice_bool", flags = "cpython" },
  { fn = "sampleBool", params = "xs: List<Bool>, k: Int", ret = "List<Bool>", rust = "random_sample_bool", flags = "cpython" },
]

