# Python's `math`, held to CPython by
# tests/expected/math.txt. Four of its members are refused
# by name instead: `frexp` and `modf` answer tuples,
# `prod` and `sumprod` answer an int or a float depending
# on the list, and `gamma`, `lgamma`, `erf` and `erfc` are
# computed by CPython itself rather than by the platform.
