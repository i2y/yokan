  { fn = "float_", params = "v: Float", ret = "String", rust = "json_float", flags = "pure cpython" },
  { fn = "bool_", params = "v: Bool", ret = "String", rust = "json_bool", flags = "pure cpython" },
  { fn = "null", params = "", ret = "String", rust = "json_null", flags = "pure cpython" },
  { fn = "array", params = "parts: List<String>", ret = "String", rust = "json_array", flags = "pure cpython" },
  { fn = "object", params = "keys: List<String>, parts: List<String>", ret = "String", rust = "json_object", flags = "pure cpython" },
  { fn = "texts", params = "xs: List<String>", ret = "List<String>", rust = "json_texts", flags = "pure cpython" },
  { fn = "ints", params = "xs: List<Int>", ret = "List<String>", rust = "json_ints", flags = "pure cpython" },
