# The standard library's manifest: one row per function that both of
# Yokan's runs land on, and the surface Rakugan's compiled run reaches
# through the same `.rpi`.
#
# A row is what an app writes (`py`, under `module`), what the `.pix`
# calls (`class.fn`), the parameters and the return in pixie's types,
# and the Rust function in this crate. The binding door, the arity and
# container-type checks, the type a call reads as, the fallible twin a
# `try` routes to, and the coverage table are all derived from this.
#
# A row with no `py` is not reachable as `module.fn`: the twins behind
# the builtins (`Py`), and the JSON writers a translator picks by the
# value's type. A row with no `rust` has no door line either.
#
# The flags: `try` a fallible twin exists (`tryFn`, `!T`,
# `<rust>_result`); `pure` no side effects and the same answer for the
# same arguments, which is what a view may call; `cpython` answers what
# CPython's module of the same name answers, and a ground-truth table
# says so; `const` a value rather than a call; `pick` the fallible twin
# follows the list's element type.
#
# The file is TOML because no language owns it: Yokan reads it, and so
# does the generator that puts the framework's own functions on the
# substrate's C face for a language whose door is C.


[[group]]
class = "Fs"
module = "fs"
layer = "yokan"
rows = [
  { py = "read_text", fn = "readText", params = "path: String", ret = "String", rust = "fs_read_text", flags = "try" },
  { py = "write_text", fn = "writeText", params = "path: String, text: String", ret = "Int", rust = "fs_write_text" },
  { py = "exists", fn = "exists", params = "path: String", ret = "Bool", rust = "fs_exists" },
  { py = "read_text_or", fn = "readTextOr", params = "path: String, default: String", ret = "String", rust = "fs_read_text_or" },
  { py = "list_dir", fn = "listDir", params = "path: String", ret = "List<String>", rust = "fs_list_dir" },
  { py = "append_text", fn = "appendText", params = "path: String, text: String", ret = "Int", rust = "fs_append_text" },
  { py = "remove", fn = "remove", params = "path: String", ret = "Int", rust = "fs_remove" },
  { py = "make_dir", fn = "makeDir", params = "path: String", ret = "Int", rust = "fs_make_dir" },
  { py = "app_dir", fn = "appDir", params = "name: String", ret = "String", rust = "fs_app_dir" },
  { py = "open_dialog", fn = "openDialog", params = "title: String", ret = "String", rust = "fs_open_dialog" },
  { py = "save_dialog", fn = "saveDialog", params = "name: String", ret = "String", rust = "fs_save_dialog" },
]

