[[group]]
class = "Json"
module = "json"
layer = "python"
rows = [
  { py = "dumps", fn = "dumps", params = "v: Any", ret = "String", flags = "pure cpython" },
  { fn = "text", params = "v: String", ret = "String", rust = "json_text", flags = "pure cpython" },
