# Python's `random`: the Mersenne Twister CPython uses and
# the algorithms `random.py` builds on it. Not pure — every
# call moves the generator on — so a view cannot ask for one.
# `shuffle` is refused by name: it reorders a list in place,
# and a list lives in a State here, which a call cannot reach
# into.
[[group]]
class = "Random"
module = "random"
layer = "python"
rows = [
  { py = "seed", fn = "seed", params = "n: Int", ret = "Int", rust = "random_seed_ret", flags = "cpython" },
  { py = "random", fn = "random", params = "", ret = "Float", rust = "random_random", flags = "cpython" },
  { py = "getrandbits", fn = "getrandbits", params = "k: Int", ret = "Int", rust = "random_getrandbits", flags = "cpython" },
  { py = "randint", fn = "randint", params = "a: Int, b: Int", ret = "Int", rust = "random_randint", flags = "cpython" },
  { py = "randrange", fn = "randrange", params = "stop: Int", ret = "Int", rust = "random_randrange", flags = "cpython" },
  { py = "randrange", fn = "randrangeFrom", params = "start: Int, stop: Int", ret = "Int", rust = "random_randrange_from", flags = "cpython" },
  { py = "randrange", fn = "randrangeStep", params = "start: Int, stop: Int, step: Int", ret = "Int", rust = "random_randrange_step", flags = "cpython" },
  { py = "uniform", fn = "uniform", params = "a: Float, b: Float", ret = "Float", rust = "random_uniform", flags = "cpython" },
  { py = "gauss", fn = "gauss", params = "mu: Float, sigma: Float", ret = "Float", rust = "random_gauss", flags = "cpython" },
  # `choice` and `sample` answer an element, so the twin
