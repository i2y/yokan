# pixie's kernel + gpui engine behind a C ABI, so a language that is not
# Python can drive the same engine: an interpreted run opens the cdylib,
# the compiled run links the staticlib, and both see ONE library — which
# is what lets a gate over the two runs mean anything. Wakakusa
# (`wakakusa/`) is the first caller; the face is pixie's, and any other
# language's door uses it as it stands.
[package]
name = "pixie-capi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pixie_capi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
pixie-kernel.workspace = true
pixie-engine-gpui = { path = "../pixie-engine-gpui" }
# A database has to be reachable from both of a door's runs, and the
# only thing both of them share is this library. The platform's own
# sqlite is what is linked, so the two runs are talking to one copy.
rusqlite = "0.32"
# Sound, WAV only: a decoder for every format would weigh more than the
# rest of an app. Not optional — one library serves both of a door's
# runs, so a per-app feature would mean two different libraries and a
# gate comparing them.
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }

# The table test reads elements.toml beside this crate with a real parser, so a
# mistake in the generator's own reader cannot pass quietly.
[dev-dependencies]
toml = { workspace = true }
