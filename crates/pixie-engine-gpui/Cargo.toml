[package]
name = "pixie-engine-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Only for `FutureExt::shared` in the image cache: a decode in flight
# is handed to every element asking for the same source (§8.38).
futures = "0.3"
pixie-kernel.workspace = true
# The Zed tree at a pinned rev (DESIGN section 5; trigger pulled
# 2026-08-23 - API drift ahead of the widget fan-out, plus P1). The
# physical vendor + carried patches replace this git pin next.
gpui = { git = "https://github.com/zed-industries/zed", rev = "d9ad6aff67e47de43abb270d22de75dd950f1b48" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d9ad6aff67e47de43abb270d22de75dd950f1b48", features = ["font-kit"] }
# `render_el` recurses once per element AND once per rider around it,
# and an unoptimized build gives that one giant function a frame near a
# megabyte — a tree nine wrappers deep overran the main thread's 8 MiB.
# stacker (already in the tree under gpui's own `stacksafe`) moves the
# recursion onto heap-allocated stack segments when the red zone is hit.
stacker = "0.1"
unicode-segmentation = "1"
# The canvas rasterizer decodes its own sprite sheets (gpui's image
# cache answers a frame later, and a rasterizer needs the pixels now)
# and hands the finished frame to gpui as an `image::Frame` — so the
# version is gpui's own, or `RenderImage::new` would not take it.
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"

[dev-dependencies]
tempfile = "3"
