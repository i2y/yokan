[package]
name = "pixie-engine-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pixie-kernel.workspace = true
# The Zed tree at a pinned rev (DESIGN section 5). The rev moves in
# three places at once: here, gpui_platform below, and the vendored
# gpui_macos, which `tools/devendor.py` re-derives.
# `stacker` is gpui's guard on its own layout and paint walk. It was
# always on until upstream made it opt-in (Zed turns it on for
# itself), and it stays on here: how deep an app's tree may nest is
# not something a dependency's default should change.
gpui = { git = "https://github.com/zed-industries/zed", rev = "bda9c0bd43a8d235d82adb01ea5bc875b861ecfc", features = ["stacker"] }
# `font-kit` is the mac side's text (without it nothing renders);
# `wayland`/`x11` are the Linux side's windowing, and gpui_platform
# defaults to NEITHER, so a Linux build without them has no backend
# to open a window with. Resolver 2 ignores a feature whose dependency
# is not active for the target, so all three ride one declaration and
# there stays exactly one rev to bump.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "bda9c0bd43a8d235d82adb01ea5bc875b861ecfc", features = ["font-kit", "wayland", "x11"] }
# `render_el` recurses once per element AND once per rider around it,
# and an unoptimized build gives that one giant function a frame near a
# megabyte — a tree nine wrappers deep overran the main thread's 8 MiB.
# stacker (already in the tree under gpui's own `stacksafe`) moves the
# recursion onto heap-allocated stack segments when the red zone is hit.
stacker = "0.1"
unicode-segmentation = "1"
# The canvas rasterizer decodes its own sprite sheets (gpui's image
# cache answers a frame later, and a rasterizer needs the pixels now)
# and hands the finished frame to gpui as an `image::Frame` — so the
# version is gpui's own, or `RenderImage::new` would not take it.
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"

[dev-dependencies]
tempfile = "3"
