<!-- Gomamochi mark: two pieces of 胡麻餅 (mochi with black sesame kneaded through) in Yokan's flat isometric language. One material all the way through, so a piece is the same off-white on every face, and the seeds show on every face too, because they are in the dough rather than on it. Mochi is soft, so the corners are rounded and each edge is a narrow band of the tone between its two faces. Palette for dark grounds. -->
