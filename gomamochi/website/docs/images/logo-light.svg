<!-- Gomamochi mark: two pieces of 胡麻餅, mochi under a coat of black sesame, in Yokan's flat isometric language. Every outer face is the coat, dark with the grain of the seeds in it, and the small piece is cut, so its front face shows the white mochi inside the rim. Mochi is soft, so the corners are rounded and each edge is a narrow band of the tone between its two faces. Same geometry one ladder darker, for light grounds. -->
