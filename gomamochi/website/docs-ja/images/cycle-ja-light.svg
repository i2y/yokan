<rect x="532.0" y="312.0" width="176" height="66" rx="8" fill="#edeff6" stroke="#b4bcd2" stroke-width="1.5"/>
<text x="620" y="341" font-size="17" fill="#1c2030" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">app.go</text>
<text x="620" y="364" font-size="13" fill="#525970" text-anchor="middle">エージェントが書く</text>
<text x="620" y="111" font-size="15" fill="#1c2030" text-anchor="middle" font-weight="600">エージェント</text>
<text x="630" y="251.5" font-size="13" fill="#525970">書く</text>
<text x="823.0" y="350.00000000000006" font-size="13" fill="#525970">読む</text>
<text x="430.23995735680387" y="209.80040307068072" font-size="17" fill="#1c2030" text-anchor="end" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">gomamochi check</text>
<text x="430.23995735680387" y="245.80040307068072" font-size="30" fill="#0a72b5" text-anchor="end" font-weight="700">0.6 秒</text>
<text x="430.23995735680387" y="269.8004030706807" font-size="14" fill="#525970" text-anchor="end">受け取れない書き方を、</text>
<text x="430.23995735680387" y="288.8004030706807" font-size="14" fill="#525970" text-anchor="end">行と書き換え方とともに名指しする</text>
<text x="430.23995735680387" y="310.8004030706807" font-size="14" fill="#0a72b5" text-anchor="end">何もビルドしない</text>
<text x="430.23995735680387" y="368.1995969293193" font-size="13" fill="#525970" text-anchor="end">ウィンドウなしの実行</text>
<text x="430.23995735680387" y="390.1995969293193" font-size="17" fill="#1c2030" text-anchor="end" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">PIXIE_SCRIPT="click:+1,dump"</text>
<text x="430.23995735680387" y="412.1995969293193" font-size="17" fill="#1c2030" text-anchor="end" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">gomamochi run</text>
<text x="430.23995735680387" y="448.1995969293193" font-size="30" fill="#0a72b5" text-anchor="end" font-weight="700">1.0 秒</text>
<text x="430.23995735680387" y="472.1995969293193" font-size="14" fill="#525970" text-anchor="end">画面を文字として印字する</text>
<text x="430.23995735680387" y="494.1995969293193" font-size="14" fill="#0a72b5" text-anchor="end">ウィンドウは開かない</text>
<text x="880" y="543" font-size="17" fill="#1c2030" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">gomamochi gate</text>
<text x="880" y="579" font-size="30" fill="#9d600a" font-weight="700">2.2 秒</text>
<text x="880" y="603" font-size="14" fill="#525970">go でビルドし、両方を動かして</text>
<text x="880" y="622" font-size="14" fill="#525970">1 バイトずつ比べる</text>
<text x="880" y="646" font-size="13" fill="#2b3044" font-family="ui-monospace,'SF Mono',Menlo,monospace">GATE OK — 3 dump lines</text>
<text x="880" y="664" font-size="13" fill="#2b3044" font-family="ui-monospace,'SF Mono',Menlo,monospace">identical in both runs</text>
<text x="1178" y="308" font-size="15" fill="#0b7a47" text-anchor="end" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,monospace">gomamochi build --release --app</text>
<text x="1178" y="330" font-size="13" fill="#525970" text-anchor="end">22.2 MB、ダブルクリックで開く</text>
<text x="44" y="692" font-size="14" fill="#525970"><tspan fill="#1c2030">速いほうの二つの答えは、どちらもプログラムが読める文字である。</tspan>直し方を名指しする断りと、画面そのもの。</text>
