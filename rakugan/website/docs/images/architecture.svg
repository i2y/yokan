<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Hiragino Sans','Noto Sans JP',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6284"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5da9e8"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ddc97"/>
    </marker>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#20243a"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="796" rx="20" fill="#14161f" stroke="#2a2e40" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="796" rx="20" fill="url(#dots)"/>

  <!-- ============ the one source file ============ -->
  <rect x="340" y="30" width="520" height="142" rx="14" fill="#1e2232" stroke="#3a4160" stroke-width="1.6"/>
  <text x="600" y="57" text-anchor="middle" font-size="21" font-weight="700" fill="#e8eaf2" font-family="ui-monospace,'SF Mono',Menlo,monospace">app.pl</text>
  <text x="600" y="78" text-anchor="middle" font-size="13" fill="#9aa0b5">a plain Perl class, written with the <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#c9d3f5">class</tspan> feature of perl 5.40</text>
  <text x="600" y="96" text-anchor="middle" font-size="12" fill="#9aa0b5">plus the subs that build the screen: <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#c9d3f5">text</tspan>, <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#c9d3f5">button</tspan>, <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#c9d3f5">column</tspan></text>
  <rect x="380" y="107" width="300" height="7" rx="3.5" fill="#39415f"/>
  <rect x="380" y="120" width="410" height="7" rx="3.5" fill="#39415f"/>
  <rect x="380" y="133" width="240" height="7" rx="3.5" fill="#39415f"/>
  <rect x="380" y="146" width="180" height="7" rx="3.5" fill="#c75f7f"/>
  <rect x="568" y="140" width="44" height="18" rx="5" fill="#251f12" stroke="#c99a4a" stroke-width="1.2"/>
  <text x="590" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#f0be62" font-family="ui-monospace,'SF Mono',Menlo,monospace">view</text>
  <text x="622" y="153" font-size="11" fill="#6f7590">← answers the screen</text>

  <path d="M540 172 C 470 196, 390 202, 335 220" fill="none" stroke="#5a6284" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M660 172 C 730 196, 810 202, 865 220" fill="none" stroke="#5a6284" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- lane captions -->
  <rect x="207" y="196" width="236" height="16" fill="#14161f"/>
  <text x="325" y="208" text-anchor="middle" font-size="13.5" fill="#5da9e8" font-weight="700">develop — rakugan run app.pl</text>
  <rect x="712" y="196" width="326" height="16" fill="#14161f"/>
  <text x="875" y="208" text-anchor="middle" font-size="13.5" fill="#e8b34a" font-weight="700">release — rakugan build app.pl --release</text>

  <!-- ============ develop lane: perl and the edit loop ============ -->
  <rect x="85" y="220" width="480" height="288" rx="14" fill="#1b2130" stroke="#2f5a86" stroke-width="1.6"/>

  <rect x="190" y="244" width="270" height="70" rx="12" fill="#2f6fae" opacity="0.35" filter="url(#glow)"/>
  <rect x="190" y="244" width="270" height="70" rx="12" fill="#16283c" stroke="#3f79b3" stroke-width="1.8"/>
  <circle cx="259" cy="267" r="5" fill="#5da9e8"/>
  <circle cx="273" cy="267" r="5" fill="#f5c542"/>
  <text x="344" y="273" text-anchor="middle" font-size="17.5" font-weight="700" fill="#cfe4f7" font-family="ui-monospace,'SF Mono',Menlo,monospace">perl 5.40+</text>
  <text x="325" y="298" text-anchor="middle" font-size="11.5" fill="#9fc4e4">the real interpreter, reading your file</text>

  <path d="M325 314 L325 346" fill="none" stroke="#3f79b3" stroke-width="1.8" marker-end="url(#arB)"/>

  <!-- the loop -->
  <path d="M 325 360 A 54 54 0 1 1 278 387" fill="none" stroke="#5da9e8" stroke-width="2.4" marker-end="url(#arB)"/>
  <text x="325" y="419" text-anchor="middle" font-size="15" font-weight="700" fill="#e8eaf2">state kept</text>
  <text x="338" y="345" text-anchor="start" font-size="12.5" font-weight="600" fill="#bcd6ee">save</text>
  <text x="404" y="431" text-anchor="start" font-size="12.5" font-weight="600" fill="#bcd6ee">the window</text>
  <text x="404" y="447" text-anchor="start" font-size="12.5" font-weight="600" fill="#bcd6ee">picks the edit up</text>
  <text x="246" y="438" text-anchor="end" font-size="12.5" font-weight="600" fill="#bcd6ee">edit</text>

  <text x="325" y="493" text-anchor="middle" font-size="13" fill="#9aa0b5">the app is real Perl here — the fast loop</text>

  <!-- ============ release lane: the translator, then pixie, then a binary ============ -->
  <rect x="635" y="220" width="480" height="288" rx="14" fill="#1b2130" stroke="#3a4160" stroke-width="1.6"/>

  <rect x="675" y="238" width="400" height="48" rx="11" fill="#1e2232" stroke="#6b74a0" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="875" y="262" text-anchor="middle" font-size="14.5" font-weight="600" fill="#c9d3f5" font-family="ui-monospace,'SF Mono',Menlo,monospace">main.pix</text>
  <text x="875" y="278" text-anchor="middle" font-size="11.5" fill="#9aa0b5">readable pixie, from the translator — 631 bytes, 0.08 s</text>

  <path d="M875 286 L875 314" fill="none" stroke="#5a6284" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="889" y="305" text-anchor="start" font-size="12" fill="#9aa0b5" font-family="ui-monospace,'SF Mono',Menlo,monospace">pixie</text>

  <rect x="675" y="314" width="400" height="86" rx="12" fill="#2a8f63" opacity="0.28" filter="url(#glow)"/>
  <rect x="675" y="314" width="400" height="86" rx="12" fill="#12291f" stroke="#2f7c58" stroke-width="1.8"/>
  <text x="875" y="348" text-anchor="middle" font-size="17.5" font-weight="700" fill="#7fe0b2">native binary</text>
  <text x="875" y="372" text-anchor="middle" font-size="11" fill="#a9c7b8">no perl in it · 11.9 MB stripped · a window in 0.2 s</text>

  <path d="M875 400 L875 430" fill="none" stroke="#2f7c58" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arG)"/>

  <rect x="685" y="430" width="380" height="44" rx="11" fill="#12291f" stroke="#2f7c58" stroke-width="1.4" stroke-dasharray="6 4"/>
  <circle cx="726" cy="452" r="4.5" fill="#3ddc97"/>
  <text x="739" y="457" text-anchor="start" font-size="12.5" font-weight="700" fill="#7fe0b2" font-family="ui-monospace,'SF Mono',Menlo,monospace">.app</text>
  <text x="783" y="457" text-anchor="start" font-size="11.5" fill="#a9c7b8"><tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11">--app</tspan> wraps it in a bundle, double-clickable</text>

  <text x="875" y="493" text-anchor="middle" font-size="13" fill="#9aa0b5">opens on a machine with neither perl nor the toolchain</text>

  <!-- ============ one engine; only the interpreted run crosses the C face ============ -->
  <path d="M325 508 L325 529" fill="none" stroke="#5a6284" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M875 508 L875 536" fill="none" stroke="#5a6284" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="85" y="540" width="1030" height="116" rx="13" fill="#1b2130" stroke="#465081" stroke-width="1.8"/>
  <rect x="296" y="531" width="58" height="18" rx="9" fill="#14161f" stroke="#465081" stroke-width="1.4"/>
  <text x="325" y="544" text-anchor="middle" font-size="11" font-weight="700" fill="#b9c6fa" letter-spacing="0.06em">C face</text>

  <rect x="165" y="556" width="320" height="40" rx="9" fill="#1e2232" stroke="#465081" stroke-width="1.2"/>
  <text x="325" y="573" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c9d3f5" font-family="ui-monospace,'SF Mono',Menlo,monospace">libpixie_capi.dylib</text>
  <text x="325" y="589" text-anchor="middle" font-size="11.5" fill="#9aa0b5">opened by the XS door, <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#c9d3f5">Rakugan::Door</tspan></text>

  <rect x="715" y="556" width="320" height="40" rx="9" fill="#1e2232" stroke="#465081" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="875" y="573" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c9d3f5"><tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12">pixie</tspan> links the engine in</text>
  <text x="875" y="589" text-anchor="middle" font-size="11.5" fill="#9aa0b5">no C face on this side</text>

  <text x="600" y="620" text-anchor="middle" font-size="16.5" font-weight="700" fill="#b9c6fa">one engine — pixie-kernel + gpui (Zed's renderer)</text>
  <text x="600" y="641" text-anchor="middle" font-size="12.5" fill="#9aa0b5">elements, state, drawing — one Rust implementation under both runs; it never holds a Perl value</text>

  <!-- ============ the gate ============ -->
  <path d="M325 656 L325 686" fill="none" stroke="#5a6284" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M875 656 L875 686" fill="none" stroke="#5a6284" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="311" y="673" text-anchor="end" font-size="11.5" fill="#8b90a5">the interpreted run's transcript</text>
  <text x="889" y="673" text-anchor="start" font-size="11.5" fill="#8b90a5">the compiled run's transcript</text>

  <rect x="85" y="690" width="1030" height="86" rx="13" fill="#251f12" stroke="#c75f7f" stroke-width="1.8"/>
  <text x="600" y="730" text-anchor="middle" font-size="18" font-weight="800" fill="#f0be62" font-family="ui-monospace,'SF Mono',Menlo,monospace">rakugan gate</text>
  <text x="600" y="757" text-anchor="middle" font-size="13" fill="#cdbfa0">drives both runs with one script and compares the two transcripts byte for byte</text>
</svg>
