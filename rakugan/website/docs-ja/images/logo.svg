<!-- Rakugan mark: two pressed lozenges of 落雁 (sugar and rice flour, dried in a mold) in Yokan's flat isometric language — one whole piece with the mold's pattern still on its face, and a cut piece turned to show the pale interior inside the amber rim. Palette for dark grounds. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g stroke-linejoin="round">
    <!-- cut piece: top, right side, front (the cut face), pale interior -->
    <path d="M2 32 L10 24 L24 24 L16 32 Z" fill="#f0c887"/>
    <path d="M16 32 L24 24 L24 40 L16 48 Z" fill="#96641d"/>
    <path d="M2 32 L16 32 L16 48 L2 48 Z" fill="#c2872f"/>
    <path d="M4 34 L14 34 L14 46 L4 46 Z" fill="#fdf3df"/>
    <!-- whole piece: top, right side, front -->
    <path d="M28 32 L36 24 L62 24 L54 32 Z" fill="#f0c887"/>
    <path d="M54 32 L62 24 L62 40 L54 48 Z" fill="#96641d"/>
    <path d="M28 32 L54 32 L54 48 L28 48 Z" fill="#c2872f"/>
    <!-- the mold's pattern, pressed into the top face -->
    <path d="M42 26h6v2h-6z M44 28h2v2h-2z M40 28h2v2h-2z M48 28h2v2h-2z" fill="#d9a457"/>
    <!-- sugar left on the front, one tone lighter than the face it sits on -->
    <path d="M31 36h2v2h-2z M37 42h2v2h-2z M43 37h2v2h-2z M49 43h2v2h-2z" fill="#f0c887"/>
    <path d="M52 26h2v2h-2z M58 26h2v2h-2z M12 26h2v2h-2z M18 26h2v2h-2z" fill="#fbe6c2"/>
  </g>
</svg>
