<text x="620" y="341" font-size="17" fill="#e8eaf2" text-anchor="middle" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">app.pl</text>
<text x="620" y="364" font-size="13" fill="#9aa0b5" text-anchor="middle">エージェントが書く</text>
<text x="620" y="111" font-size="15" fill="#e8eaf2" text-anchor="middle" font-weight="600">エージェント</text>
<text x="630" y="251.5" font-size="13" fill="#9aa0b5">書く</text>
<text x="823.0" y="350.00000000000006" font-size="13" fill="#9aa0b5">読む</text>
<text x="430.23995735680387" y="209.80040307068072" font-size="17" fill="#e8eaf2" text-anchor="end" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">rakugan check</text>
<text x="430.23995735680387" y="245.80040307068072" font-size="30" fill="#5cc8ff" text-anchor="end" font-weight="700">0.07 s</text>
<text x="430.23995735680387" y="269.8004030706807" font-size="14" fill="#9aa0b5" text-anchor="end">受け取れない書き方を、</text>
<text x="430.23995735680387" y="288.8004030706807" font-size="14" fill="#9aa0b5" text-anchor="end">行と書き換え方とともに名指しする</text>
<text x="430.23995735680387" y="310.8004030706807" font-size="14" fill="#5cc8ff" text-anchor="end">コンパイラは起動しない</text>
<text x="430.23995735680387" y="368.1995969293193" font-size="13" fill="#9aa0b5" text-anchor="end">ウィンドウなしの実行</text>
<text x="430.23995735680387" y="390.1995969293193" font-size="17" fill="#e8eaf2" text-anchor="end" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">PIXIE_SCRIPT="click:+1,dump"</text>
<text x="430.23995735680387" y="412.1995969293193" font-size="17" fill="#e8eaf2" text-anchor="end" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">rakugan run</text>
<text x="430.23995735680387" y="448.1995969293193" font-size="30" fill="#5cc8ff" text-anchor="end" font-weight="700">0.07 s</text>
<text x="430.23995735680387" y="472.1995969293193" font-size="14" fill="#9aa0b5" text-anchor="end">画面を文字として印字する</text>
<text x="430.23995735680387" y="494.1995969293193" font-size="14" fill="#5cc8ff" text-anchor="end">ウィンドウは開かない</text>
<text x="880" y="543" font-size="17" fill="#e8eaf2" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,monospace">rakugan gate</text>
<text x="880" y="579" font-size="30" fill="#f2b04e" font-weight="700">2.8 s</text>
<text x="880" y="603" font-size="14" fill="#9aa0b5">翻訳してコンパイルし、</text>
<text x="880" y="622" font-size="14" fill="#9aa0b5">両方を動かして 1 バイトずつ比べる</text>
<text x="880" y="646" font-size="13" fill="#d5dbee" font-family="ui-monospace,'SF Mono',Menlo,monospace">GATE OK — 3 dump lines</text>
<text x="880" y="664" font-size="13" fill="#d5dbee" font-family="ui-monospace,'SF Mono',Menlo,monospace">identical in both runs</text>
<text x="1178" y="308" font-size="15" fill="#3ddc97" text-anchor="end" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,monospace">rakugan build --release --app</text>
<text x="1178" y="330" font-size="13" fill="#9aa0b5" text-anchor="end">11.9 MB、ダブルクリックで開く</text>
<text x="44" y="692" font-size="14" fill="#9aa0b5"><tspan fill="#e8eaf2">速いほうの二つの答えは、どちらもプログラムが読める文字である。</tspan>直し方を名指しする断りと、画面そのもの。</text>
