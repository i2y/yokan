<!-- Rakugan mark: two pressed pieces of 落雁 (rice flour and sugar, pressed in a mold and dried) in Yokan's flat isometric language. One material all the way through, so a piece is the same colour on every face — what a mold leaves on the top face is the whole of the decoration. White is the plain piece; the other is tinted 紅, the way the pieces in a box are. Same geometry one ladder darker, for light grounds. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g stroke-linejoin="round">
    <!-- the tinted piece: top, right side, front -->
    <path d="M2 32 L10 24 L26 24 L18 32 Z" fill="#e6a2b7"/>
    <path d="M18 32 L26 24 L26 40 L18 48 Z" fill="#8a3d55"/>
    <path d="M2 32 L18 32 L18 48 L2 48 Z" fill="#c75f7f"/>
    <!-- the mold's pattern, pressed into the top face -->
    <path d="M8 26h8v2h-8z M10 28h2v2h-2z M14 28h2v2h-2z" fill="#cf8ba0"/>
    <!-- the plain piece: top, right side, front -->
    <path d="M28 32 L36 24 L62 24 L54 32 Z" fill="#efe8e0"/>
    <path d="M54 32 L62 24 L62 40 L54 48 Z" fill="#a49a92"/>
    <path d="M28 32 L54 32 L54 48 L28 48 Z" fill="#ded5cb"/>
    <!-- its mold pattern: a bloom, three petals and a centre -->
    <path d="M42 26h6v2h-6z M40 28h2v2h-2z M44 28h2v2h-2z M48 28h2v2h-2z M52 26h2v2h-2z" fill="#c3b7a9"/>
  </g>
</svg>
