<!-- Wakakusa mark: a bar of 若草 (gyūhi under a coat of green sugar) in Yokan's flat isometric language — one whole piece with its granular coat, and a cut piece turned to show the pale gyūhi inside the green rim. Palette for dark grounds. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g stroke-linejoin="round">
    <!-- cut piece: top, right side, front (the cut face), gyūhi interior -->
    <path d="M2 32 L10 24 L24 24 L16 32 Z" fill="#b0e86a"/>
    <path d="M16 32 L24 24 L24 40 L16 48 Z" fill="#4c9130"/>
    <path d="M2 32 L16 32 L16 48 L2 48 Z" fill="#63b83c"/>
    <path d="M4 34 L14 34 L14 46 L4 46 Z" fill="#eaf4cf"/>
    <!-- whole piece: top, right side, front -->
    <path d="M28 32 L36 24 L62 24 L54 32 Z" fill="#b0e86a"/>
    <path d="M54 32 L62 24 L62 40 L54 48 Z" fill="#4c9130"/>
    <path d="M28 32 L54 32 L54 48 L28 48 Z" fill="#63b83c"/>
    <!-- sugar grains: one tone lighter than the face they sit on -->
    <path d="M30 35h2v2h-2z M36 42h2v2h-2z M42 36h2v2h-2z M48 43h2v2h-2z M51 34h2v2h-2z" fill="#b0e86a"/>
    <path d="M40 26h2v2h-2z M50 27h2v2h-2z M46 29h2v2h-2z M55 26h2v2h-2z M12 26h2v2h-2z M17 26h2v2h-2z M9 29h2v2h-2z" fill="#e2f7bd"/>
    <path d="M57 34h2v2h-2z M58 39h2v2h-2z M19 38h2v2h-2z" fill="#63b83c"/>
  </g>
</svg>
