<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 556" font-family="'Hiragino Sans','Noto Sans JP',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f88a8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="690" height="556" rx="10" fill="#fbfcfe"/>
  <!-- the one source file -->
  <path d="M125 12 H561 L575 26 V78 Q575 88 565 88 H125 Q115 88 115 78 V22 Q115 12 125 12 Z" fill="#edeff6" stroke="#b4bcd2" stroke-width="1"/>
  <path d="M561 12 V26 H575" fill="none" stroke="#b4bcd2" stroke-width="1"/>
  <text x="345" y="37" font-size="17" fill="#1c2030" text-anchor="middle" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,monospace">app.rb</text>
  <text x="345" y="57" font-size="12.5" fill="#525970" text-anchor="middle">普通の Ruby のクラス</text>
  <text x="345" y="76" font-size="12.5" fill="#525970" text-anchor="middle">画面を組み立てる <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.0" fill="#2c3348">text</tspan>、<tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.0" fill="#2c3348">button</tspan>、<tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.0" fill="#2c3348">column</tspan> を若草が足す</text>
  <!-- two roads -->
  <path d="M345 88 V100 H174 V110" fill="none" stroke="#7f88a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M345 88 V100 H516 V110" fill="none" stroke="#7f88a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- lane: 書いているあいだ -->
  <text x="174" y="129" font-size="13.5" fill="#3f7d28" text-anchor="middle" font-weight="700">書いているあいだ</text>
  <rect x="12" y="140" width="324" height="48" rx="8" fill="#edeff6" stroke="#b4bcd2" stroke-width="1"/>
  <text x="24" y="160" font-size="12" fill="#1c2030" font-family="ui-monospace,'SF Mono',Menlo,monospace">ruby -Ilib -Idoor/cruby app.rb</text>
  <text x="24" y="179" font-size="12.5" fill="#525970">本物のインタプリタ（CRuby）がファイルを読む</text>
  <path d="M174 188 V214" fill="none" stroke="#7f88a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="182" y="205" font-size="12" fill="#525970">ウィンドウが開く</text>
  <rect x="12" y="214" width="324" height="48" rx="8" fill="#f1f8ea" stroke="#9ec97f" stroke-width="1"/>
  <text x="24" y="234" font-size="12.5" fill="#35701f">保存すると、その変更がウィンドウに反映される</text>
  <text x="24" y="252" font-size="12" fill="#525970">走り直さないので、状態はそのまま</text>
  <path d="M174 262 V300" fill="none" stroke="#7f88a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- lane: リリースするとき -->
  <text x="516" y="129" font-size="13.5" fill="#3f7d28" text-anchor="middle" font-weight="700">リリースするとき</text>
  <rect x="354" y="140" width="324" height="48" rx="8" fill="#edeff6" stroke="#b4bcd2" stroke-width="1"/>
  <text x="366" y="160" font-size="12" fill="#1c2030" font-family="ui-monospace,'SF Mono',Menlo,monospace">spinel --int-overflow=promote -c</text>
  <text x="366" y="179" font-size="12.5" fill="#525970">同じ Ruby を C にコンパイルする</text>
  <path d="M516 188 V214" fill="none" stroke="#7f88a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="524" y="205" font-size="12" fill="#525970" font-family="ui-monospace,'SF Mono',Menlo,monospace">cc</text>
  <rect x="354" y="214" width="324" height="48" rx="8" fill="#f1f8ea" stroke="#9ec97f" stroke-width="1"/>
  <text x="366" y="234" font-size="12.5" fill="#35701f">ネイティブバイナリが 1 本、12.3 MB</text>
  <text x="366" y="252" font-size="12" fill="#525970">配った先のマシンに Ruby は要らない</text>
  <path d="M516 262 V300" fill="none" stroke="#7f88a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- one engine, behind a C ABI -->
  <rect x="12" y="288" width="666" height="174" rx="10" fill="#f1f8ea" stroke="#9ec97f" stroke-width="1.2"/>
  <rect x="318" y="279" width="54" height="18" rx="9" fill="#fbfcfe" stroke="#9ec97f" stroke-width="1"/>
  <text x="345" y="292.5" font-size="11" fill="#3f7d28" text-anchor="middle" font-weight="700" letter-spacing=".06em">C ABI</text>
  <rect x="24" y="300" width="300" height="44" rx="7" fill="#edeff6" stroke="#b4bcd2" stroke-width="1"/>
  <text x="36" y="319" font-size="12" fill="#1c2030" font-family="ui-monospace,'SF Mono',Menlo,monospace">libpixie_capi.dylib</text>
  <text x="36" y="337" font-size="12" fill="#525970">door が共有ライブラリとして開く</text>
  <rect x="366" y="300" width="300" height="44" rx="7" fill="#edeff6" stroke="#b4bcd2" stroke-width="1"/>
  <text x="378" y="319" font-size="12" fill="#1c2030" font-family="ui-monospace,'SF Mono',Menlo,monospace">libpixie_capi.a</text>
  <text x="378" y="337" font-size="12" fill="#525970">spinel のランタイムごと、静的にリンクする</text>
  <text x="227" y="372" font-size="15" fill="#3f7d28" font-weight="700">エンジンは一つ</text>
  <text x="343" y="372" font-size="12" fill="#525970" font-family="ui-monospace,'SF Mono',Menlo,monospace">crates/pixie-capi</text>
  <text x="345" y="394" font-size="12.5" fill="#2c3348" text-anchor="middle">要素は開き、番号で書き込み、閉じる。ハンドラは door が配る番号</text>
  <text x="345" y="412" font-size="12.5" fill="#2c3348" text-anchor="middle">エンジンは Ruby のオブジェクトを持たない</text>
  <text x="345" y="430" font-size="12.5" fill="#2c3348" text-anchor="middle">だから同じ実装を、インタプリタからもコンパイル済みのバイナリからも、そのまま使える</text>
  <text x="345" y="449" font-size="12" fill="#525970" text-anchor="middle">番号はどれも、一つの表 <tspan font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#525970">elements.toml</tspan> から書き出される</text>
  <!-- the gate -->
  <path d="M174 462 V488" fill="none" stroke="#7f88a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="182" y="479" font-size="12" fill="#525970">記録</text>
  <path d="M516 462 V488" fill="none" stroke="#7f88a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="524" y="479" font-size="12" fill="#525970">記録</text>
  <rect x="12" y="488" width="666" height="56" rx="8" fill="#edeff6" stroke="#3f7d28" stroke-width="1.4"/>
  <text x="345" y="511" font-size="14" fill="#1c2030" text-anchor="middle" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,monospace">wakakusa gate</text>
  <text x="345" y="532" font-size="12.5" fill="#525970" text-anchor="middle">ゲートは、一つのスクリプトで二つの実行を動かし、二つの記録を一バイトずつ比べる</text>
</svg>
