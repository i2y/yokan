<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t" font-family="'Hiragino Sans','Noto Sans JP',system-ui,-apple-system,sans-serif">
  <title id="t">The loop: the agent writes app.rb, and check, run and gate hand back text it reads</title>
  <defs>
    <marker id="ah-lav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5f45cc"/>
    </marker>
    <marker id="ah-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3f7d28"/>
    </marker>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#e9ecf4"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect x="2" y="2" width="1196" height="716" rx="20" fill="#fbfcfe" stroke="#dcdfe9" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="716" rx="20" fill="url(#dots)"/>

  <!-- caption -->
  <text x="40" y="78" font-size="20" font-weight="600" fill="#1d2030">The loop</text>
  <text x="40" y="101" font-size="15" fill="#5d6380">every answer is text</text>

  <!-- ===== the terminal: one session, four exchanges, a cost column ===== -->
  <rect x="280" y="44" width="886" height="560" rx="12" fill="#ffffff" stroke="#d5d9e4" stroke-width="1"/>
  <path d="M292,44 H1154 a12,12 0 0 1 12,12 V80 H280 V56 a12,12 0 0 1 12,-12 Z" fill="#f7f8fb"/>
  <line x1="280" y1="80.5" x2="1166" y2="80.5" stroke="#e4e7ef" stroke-width="1"/>
  <circle cx="302" cy="62" r="4.5" fill="#c8ccd8"/>
  <circle cx="318" cy="62" r="4.5" fill="#c8ccd8"/>
  <circle cx="334" cy="62" r="4.5" fill="#c8ccd8"/>

  <!-- the ledger's rules: one between each exchange, one before the cost column -->
  <line x1="281" y1="254.5" x2="1165" y2="254.5" stroke="#e4e7ef" stroke-width="1"/>
  <line x1="281" y1="338.5" x2="1165" y2="338.5" stroke="#e4e7ef" stroke-width="1"/>
  <line x1="281" y1="470.5" x2="1165" y2="470.5" stroke="#e4e7ef" stroke-width="1"/>
  <line x1="896.5" y1="81" x2="896.5" y2="603" stroke="#e4e7ef" stroke-width="1"/>

  <!-- transcript: 13.5px mono, baseline pitch 24 -->
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" fill="#3f4560">
    <!-- 1: check -> a refusal -->
    <text x="306" y="112"><tspan fill="#6b7189">$ </tspan><tspan fill="#1a63c4">wakakusa check</tspan><tspan fill="#4a5068"> app.rb</tspan></text>
    <text x="306" y="136" fill="#c0302a">app.rb:9:5: Wakakusa cannot take this — a view only reads.</text>
    <text x="306" y="160" fill="#c0302a">Move the write into a handler — the block on a button,</text>
    <text x="306" y="184" fill="#c0302a">or a method the app calls from one</text>
    <text x="306" y="208" fill="#6f7590" xml:space="preserve">    @count = @count + 1</text>
    <text x="306" y="232" fill="#c0302a" xml:space="preserve">    ^</text>

    <!-- 2: check -> silence -->
    <text x="306" y="284"><tspan fill="#6b7189">$ </tspan><tspan fill="#1a63c4">wakakusa check</tspan><tspan fill="#4a5068"> app.rb</tspan></text>

    <!-- 3: a headless run -> the screen, three times -->
    <text x="306" y="368"><tspan fill="#6b7189">$ </tspan><tspan fill="#4a5068">PIXIE_SCRIPT="click:+1,dump" </tspan><tspan fill="#1a63c4">wakakusa run</tspan><tspan fill="#4a5068"> app.rb</tspan></text>
    <text x="306" y="392">Column(spacing=12, padding=16)[Text(count: 0, fontSize=34), Button(+1)]</text>
    <text x="306" y="416">Column(spacing=12, padding=16)[Text(count: 1, fontSize=34), Button(+1)]</text>
    <text x="306" y="440">Column(spacing=12, padding=16)[Text(count: 1, fontSize=34), Button(+1)]</text>

    <!-- 4: gate -> GATE OK -->
    <text x="306" y="500"><tspan fill="#6b7189">$ </tspan><tspan fill="#a85a00">wakakusa gate</tspan><tspan fill="#4a5068"> app.rb --script "click:+1,dump"</tspan></text>
    <text x="306" y="524" fill="#3f7d28">GATE OK — 3 dump lines identical in both runs</text>

    <!-- the next prompt -->
    <text x="306" y="572"><tspan fill="#6b7189">$ </tspan></text>
  </g>
  <rect x="322" y="560" width="8" height="15" fill="#3f4560" fill-opacity="0.7"/>

  <!-- ===== the cost column: what each exchange took ===== -->
  <g font-size="15" fill="#5d6380">
    <text x="918" y="118" fill="#1a63c4"><tspan font-size="28" font-weight="700">0.1</tspan><tspan font-size="20" font-weight="600"> s</tspan></text>
    <text x="918" y="142">no compiler, no window</text>
    <text x="918" y="162">run on every edit</text>

    <text x="918" y="290" fill="#1a63c4"><tspan font-size="28" font-weight="700">0.1</tspan><tspan font-size="20" font-weight="600"> s</tspan></text>
    <text x="918" y="314">silence: Wakakusa can take it</text>

    <text x="918" y="374" fill="#1a63c4"><tspan font-size="28" font-weight="700">0.7</tspan><tspan font-size="20" font-weight="600"> s</tspan></text>
    <text x="918" y="398">no compiler, no window</text>
    <text x="918" y="418">the screen, as text</text>

    <text x="918" y="506" fill="#a85a00"><tspan font-size="28" font-weight="700">2.1</tspan><tspan font-size="20" font-weight="600"> s</tspan><tspan dx="14" font-size="16" font-weight="600">a compile</tspan></text>
    <text x="918" y="530">both runs, byte-compared</text>
    <text x="918" y="550">when the change is done</text>
  </g>

  <!-- ===== the agent and the loop (left) ===== -->
  <circle cx="112" cy="320" r="60" fill="none" stroke="#5f45cc" stroke-width="1.5" stroke-opacity="0.65"/>
  <rect x="88" y="302" width="48" height="38" rx="11" fill="#ffffff" stroke="#5f45cc" stroke-width="2"/>
  <rect x="100" y="314" width="6" height="13" rx="3" fill="#5f45cc"/>
  <rect x="118" y="314" width="6" height="13" rx="3" fill="#5f45cc"/>
  <line x1="112" y1="302" x2="112" y2="293" stroke="#5f45cc" stroke-width="2"/>
  <circle cx="112" cy="290" r="3" fill="#5f45cc"/>
  <rect x="81" y="316" width="4" height="10" rx="2" fill="#5f45cc"/>
  <rect x="139" y="316" width="4" height="10" rx="2" fill="#5f45cc"/>
  <text x="112" y="404" text-anchor="middle" font-size="15" fill="#5d6380">the agent</text>

  <!-- feed: agent -> app.rb -> the prompt -->
  <path d="M154,278 C172,252 190,226 207,197" fill="none" stroke="#5f45cc" stroke-width="2"/>
  <path d="M204,161 C216,138 244,108 280,108" fill="none" stroke="#5f45cc" stroke-width="2" marker-end="url(#ah-lav)"/>
  <g transform="translate(196,162)">
    <path d="M0,0 H16 L26,10 V34 H0 Z" fill="#fbfcfe" stroke="#5f45cc" stroke-width="1.6"/>
    <path d="M16,0 V10 H26" fill="none" stroke="#5f45cc" stroke-width="1.6"/>
  </g>
  <text x="184" y="172" text-anchor="end" font-size="15" fill="#5d6380">writes</text>
  <text x="184" y="192" text-anchor="end" font-size="14.5" fill="#1d2030" font-family="ui-monospace,'SF Mono',Menlo,monospace">app.rb</text>

  <!-- return: what came back -> the agent -->
  <path d="M280,568 C220,568 190,415 154,362" fill="none" stroke="#5f45cc" stroke-width="2" marker-end="url(#ah-lav)"/>
  <text x="222" y="568" text-anchor="end" font-size="16" font-weight="600" fill="#5f45cc">reads the text</text>
  <text x="222" y="589" text-anchor="end" font-size="15" fill="#5d6380">edits, goes round again</text>

  <!-- ===== ship: out of the terminal, from the GATE OK line ===== -->
  <circle cx="680" cy="519" r="3" fill="#3f7d28"/>
  <path d="M680,519 H748 a12,12 0 0 1 12,12 V632 a12,12 0 0 0 12,12 H902" fill="none" stroke="#3f7d28" stroke-width="2" stroke-opacity="0.8" marker-end="url(#ah-gate)"/>
  <rect x="914" y="622" width="44" height="44" rx="12" fill="#e3f5ea" stroke="#0b7a47" stroke-width="2"/>
  <rect x="925" y="636" width="22" height="16" rx="3" fill="none" stroke="#0b7a47" stroke-width="1.6" stroke-opacity="0.85"/>
  <line x1="925" y1="641" x2="947" y2="641" stroke="#0b7a47" stroke-width="1.6" stroke-opacity="0.85"/>
  <text x="972" y="641" font-size="17" font-weight="600" fill="#0b7a47">ship</text>
  <text x="972" y="661" font-size="15" fill="#5d6380">a native binary</text>
</svg>
